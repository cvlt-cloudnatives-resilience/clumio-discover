name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint test
      - name: Third-party licenses
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          make licenses
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Free disk and add swap
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h
      - name: Install zig
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user ziglang==0.17.0 cargo-zigbuild==0.24.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then build=zigbuild; else build=build; fi
          cargo $build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="clumio-discover-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/clumio-discover" README.md CHANGELOG.md LICENSE THIRD-PARTY-LICENSES.txt config.example.toml policy/clumio-discover-readonly.json "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "clumio-discover-$env:GITHUB_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/clumio-discover.exe", README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-LICENSES.txt, config.example.toml, policy/clumio-discover-readonly.json $name
          Compress-Archive $name "$name.zip"
          "ASSET=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      RELEASES_REPO: cvlt-cloudnatives-resilience/clumio-discover-releases
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - name: Release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md |
            awk 'NF {for (; n > 0; n--) print ""; print; next} {n++}' > changes.md
          if ! grep -q . changes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
          if previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null); then
            full="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
          else
            full="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi
          notes() {
            echo "## What's Changed"
            cat changes.md
            echo
            echo "**Full Changelog**: $1"
            echo
            echo "Download the package for your computer and check it against \`SHA256SUMS\`. Install steps are in the [README](https://github.com/${RELEASES_REPO}#install)."
          }
          notes "$full" > notes.md
          notes "https://github.com/${RELEASES_REPO}/blob/main/CHANGELOG.md" > public-notes.md
          cat notes.md public-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: notes.md
      - uses: actions/checkout@v4
        if: env.RELEASES_TOKEN != ''
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ env.RELEASES_TOKEN }}
          path: releases-repo
      - name: Update the releases repo
        if: env.RELEASES_TOKEN != ''
        run: |
          mkdir -p releases-repo/policy releases-repo/docs
          cp README.md CHANGELOG.md LICENSE config.example.toml releases-repo/
          cp policy/clumio-discover-readonly.json releases-repo/policy/
          cp docs/*.png releases-repo/docs/
          cd releases-repo
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update for ${GITHUB_REF_NAME}"
            git push
          fi
      - uses: softprops/action-gh-release@v2
        if: env.RELEASES_TOKEN != ''
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ env.RELEASES_TOKEN }}
          target_commitish: main
          files: assets/*
          body_path: public-notes.md
